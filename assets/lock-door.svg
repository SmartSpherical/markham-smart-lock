<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Black smart lock with glass keypad and fingerprint lever handle on a green front door">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ece2"/><stop offset="1" stop-color="#ded5c5"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d5246"/><stop offset="1" stop-color="#1e3a32"/>
    </linearGradient>
    <linearGradient id="panelIn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#244439"/><stop offset="1" stop-color="#2f5649"/>
    </linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d1c2"/><stop offset=".25" stop-color="#faf7f1"/><stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30353b"/><stop offset=".5" stop-color="#0e1012"/><stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lever" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5056"/><stop offset=".45" stop-color="#16191c"/><stop offset="1" stop-color="#08090a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#9aa1a8"/><stop offset="1" stop-color="#e3e6e9"/>
    </linearGradient>
    <radialGradient id="brass" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#e8cf98"/><stop offset=".6" stop-color="#b08a4a"/><stop offset="1" stop-color="#7d5f2c"/>
    </radialGradient>
    <radialGradient id="light" cx=".85" cy=".08" r=".95">
      <stop offset="0" stop-color="#fff6e2" stop-opacity=".45"/><stop offset="1" stop-color="#fff6e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6fe3bf" stop-opacity=".9"/><stop offset="1" stop-color="#6fe3bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-12" dy="20" stdDeviation="16" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="glassClip"><rect x="428" y="178" width="124" height="644" rx="20"/></clipPath>
  </defs>

  <!-- wall and casing -->
  <rect width="800" height="1000" fill="url(#wall)"/>
  <rect x="600" y="0" width="70" height="1000" fill="url(#trim)"/>
  <rect x="664" y="0" width="6" height="1000" fill="#000" opacity=".08"/>

  <!-- door slab with raised panels -->
  <rect x="0" y="0" width="604" height="1000" fill="url(#door)"/>
  <rect x="598" y="0" width="6" height="1000" fill="#000" opacity=".25"/>
  <g fill="url(#panelIn)" stroke="#16302a" stroke-width="3">
    <rect x="58" y="70" width="300" height="380" rx="6"/>
    <rect x="58" y="530" width="300" height="420" rx="6"/>
  </g>
  <g fill="none" stroke="#4b7466" stroke-width="2" opacity=".6">
    <path d="M61 447V73h294"/>
    <path d="M61 947V533h294"/>
  </g>

  <!-- lock body -->
  <g filter="url(#drop)">
    <rect x="418" y="168" width="144" height="664" rx="28" fill="#050607" stroke="#3a3f45" stroke-width="2"/>
    <rect x="428" y="178" width="124" height="644" rx="20" fill="url(#glass)"/>
  </g>
  <g clip-path="url(#glassClip)">
    <path d="M420 178h70L420 470z" fill="url(#sheen)"/>
    <path d="M552 560v262h-60z" fill="#fff" opacity=".04"/>
  </g>

  <!-- status light -->
  <ellipse cx="490" cy="222" rx="34" ry="10" fill="url(#glow)"/>
  <rect x="474" y="220" width="32" height="4" rx="2" fill="#a8f5dc"/>

  <!-- keypad -->
  <g fill="#bdf3e2">
    <circle cx="458" cy="300" r="5"/><circle cx="490" cy="300" r="5"/><circle cx="522" cy="300" r="5"/>
    <circle cx="458" cy="340" r="5"/><circle cx="490" cy="340" r="5"/><circle cx="522" cy="340" r="5"/>
    <circle cx="458" cy="380" r="5"/><circle cx="490" cy="380" r="5"/><circle cx="522" cy="380" r="5"/>
    <circle cx="458" cy="420" r="5" opacity=".55"/><circle cx="490" cy="420" r="5"/><circle cx="522" cy="420" r="5" opacity=".55"/>
  </g>
  <g fill="#6fe3bf" opacity=".22">
    <circle cx="458" cy="300" r="11"/><circle cx="490" cy="300" r="11"/><circle cx="522" cy="300" r="11"/>
    <circle cx="458" cy="340" r="11"/><circle cx="490" cy="340" r="11"/><circle cx="522" cy="340" r="11"/>
    <circle cx="458" cy="380" r="11"/><circle cx="490" cy="380" r="11"/><circle cx="522" cy="380" r="11"/>
    <circle cx="490" cy="420" r="11"/>
  </g>

  <!-- card reader mark -->
  <g fill="none" stroke="#c9a86a" stroke-width="2.5" stroke-linejoin="round">
    <rect x="474" y="482" width="26" height="18" rx="3"/>
    <path d="M480 476h24a3 3 0 0 1 3 3v15"/>
  </g>

  <!-- keyhole cover -->
  <rect x="474" y="716" width="32" height="56" rx="12" fill="#14171a" stroke="#353a40" stroke-width="2"/>
  <rect x="486" y="730" width="8" height="28" rx="4" fill="#050607"/>

  <!-- lever handle with fingerprint sensor -->
  <g filter="url(#soft)">
    <rect x="236" y="586" width="262" height="46" rx="23" fill="url(#lever)"/>
    <circle cx="490" cy="609" r="40" fill="url(#chrome)"/>
    <circle cx="490" cy="609" r="31" fill="url(#lever)"/>
    <circle cx="259" cy="609" r="27" fill="#0b0d0f"/>
  </g>
  <rect x="270" y="592" width="200" height="6" rx="3" fill="#fff" opacity=".2"/>
  <circle cx="259" cy="609" r="19" fill="url(#brass)"/>
  <g fill="none" stroke="#5e4620" stroke-width="1.6" stroke-linecap="round" opacity=".7">
    <path d="M253 618a7 7 0 0 1 0-10"/>
    <path d="M259 620v-6a4 4 0 0 1 8 0v3"/>
    <path d="M249 613a10 10 0 0 1 19-5"/>
    <path d="M251 603a12 12 0 0 1 17 2"/>
    <path d="M263 621a8 8 0 0 0 1-4"/>
  </g>

  <!-- warm light -->
  <rect width="800" height="1000" fill="url(#light)"/>
</svg>
